# dsh-compact — 压缩增强 bundle patch。
#
# 与 dsh-unified-market 同格式：`- insert:` 新增
# 行，而非顶层 id-target 覆盖。顶层覆盖只在「目标行已存在」时生效 —— 以
# bundle 方式单独装载（`dsh plugin add dsh-compact`）时目标行尚不存在，
# 会报 `patch: entry "compact" not found` 并整包跳过（0.2.0-rc.2 实机复现）。
# 内置分发路径由 companion-sync 写 insert 行，removeBundledRowDuplicates
# 会自动去重，两种路径因此等效。
- insert:
    - id: compact
      name: 'dsh-compact'