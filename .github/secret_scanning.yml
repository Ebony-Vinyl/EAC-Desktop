# GitHub 机密扫描（secret scanning）路径排除
#
# 只排除一个文件，作用域尽可能窄：
#
#   dsh-desktop/assets/plugins/dsh-our-free-model/vendor/channel-pack/pack.js
#
# 理由：
# 1. 该文件是**第三方 vendored 产物**（上游 Ebony-Vinyl/dsh-our-free-model
#    的 GitHub Release 预构建 tgz），本仓不是它的作者，也不应改写其内容。
# 2. 其中的 `GEMINI_DEFAULT_CLIENT_ID` / `GEMINI_DEFAULT_CLIENT_SECRET` 是
#    上游自述的「公开 client」出厂默认值（见上游 src/gemini-oauth.ts 的常量
#    注释：「上游 Cloud Code 客户端的公开 client（env 可覆盖，用于自建凭据的
#    场景）」）。Google 的「已安装应用」型 OAuth client 依 RFC 8252 用 loopback
#    重定向，其 client_secret 不是机密；且该值早已公开在同一上游仓库
#    （public、数万 star、数百 fork）与其 Release 资产中。
# 3. 运行时可用环境变量覆盖（CMDC_PAK_GOOGLE_CLIENT_ID /
#    CMDC_PAK_GOOGLE_CLIENT_SECRET）；内置值仅为未配置时的兜底，删除会导致
#    Gemini 渠道无法登录。
#
# 排除范围严格限定到这一条路径，不涉及本仓自有代码：本仓自己新增的凭据
# 仍照常受机密扫描保护。
paths-ignore:
  - "dsh-desktop/assets/plugins/dsh-our-free-model/vendor/channel-pack/pack.js"
