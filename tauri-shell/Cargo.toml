[package]
name = "dsh-eac-tauri-shell"
version = "6.1.0"
description = "Deepseek Harness EAC — Tauri ShellHost PoC (ADR 0002 L1)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# SYNC-006：多 webview 能力（Window::add_child / WebviewBuilder）被 "unstable"
# feature 门控。该 feature 展开为 tauri-runtime-wry?/unstable，而
# tauri-runtime-wry 2.11.4 的 unstable = []（空 feature）—— 启用它不新增
# 依赖、不顶动 Cargo.lock 的 WebView 栈锁定版本（tauri 2.11.5 / wry 0.55.1 /
# tao 0.35.3），只解锁既有依赖里的多 webview 代码路径。
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
tauri-plugin-single-instance = "2"
# SYNC-004（__DSH_DIRECTORY_PICKER__）：官方原生目录选择对话框
#（dialog.showOpenDialog(['openDirectory','createDirectory']) 的 EAC 等价物）。
# 仅用其 Rust 侧 FileDialogBuilder.pick_folder；WebView 侧的 plugin:dialog|*
# IPC 命令面未授权（无 capability 声明），页面不可绕过桥直达。
# 钉版 2.7.3：2.8.0 起硬要求 tauri ^2.12，会把锁定的 tauri 2.11.5 / wry
# 0.55 / tao 0.35 整棵 WebView 栈顶上去（视口自愈等敏感行为随之漂移）；
# 本任务只加目录选择能力，不动既有 WebView 运行时。
tauri-plugin-dialog = "=2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "io-util", "process", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
http = "1"

# Windows 原生外链/文件打开、语言环境检测及任务栏 Big 图标（WM_SETICON）：
# 经 ShellExecuteW、Globalization API 和 USER32 直接调用。版本对齐依赖树既有 0.61.x。
[target.'cfg(windows)'.dependencies]
# Reuse Tauri's locked COM bindings for the native ProcessFailed callback.
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows-sys = { version = "0.61", features = [
  "Win32_Globalization",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
] }
 

[[bin]]
name = "dsh-eac-shell"
path = "src/main.rs"

[profile.dev]
incremental = true
